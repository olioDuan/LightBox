name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python 3.12 environment
        run: uv sync --python 3.12

      - name: Ruff lint (including TID251 no-delete/no-overwrite gate)
        run: uv run ruff check .

      - name: Custom AST no-delete check
        run: uv run python scripts/check_no_delete.py

      - name: Import-linter architecture boundary check
        run: uv run lint-imports

      - name: Mypy static type check
        run: uv run mypy src

      - name: Pytest (offline unit tests + sqlite-vec extension load check)
        run: uv run pytest
